# MiniMessage exclusivement. Fichier serveur : plugins/HCPlugins/HCTranslationKey.yml
# Les placeholders externes doivent être explicitement autorisés ET sans effets.
settings:
  allowed-placeholders:
    - player_name

theme:
  colors:
    primary: "#FBC62C"
    secondary: "#FEB967"
    text: "#CCCCCC"
    detail: "#C0F5FA"
    value: "#FFD966"
    muted: "#888888"
    success: "#55FF55"
    warning: "#F2D022"
    error: "#E62E39"

components:
  prefix:
    standard: "<[[hctkey:theme.colors.primary]]><bold>H</bold></[[hctkey:theme.colors.primary]]> <dark_gray>┃</dark_gray>"
    error: "<[[hctkey:theme.colors.error]]><bold>ERREUR</bold></[[hctkey:theme.colors.error]]> <dark_gray>┃</dark_gray>"

ui:
  close: "<red>Fermer</red>"
  back: "<yellow>Retour</yellow>"

menu:
  title:
    item: "<gold><bold>{0}</bold> <dark_gray>—</dark_gray> {1}</gold>"
  detail: "<aqua>{0}</aqua> <dark_gray>:</dark_gray> <yellow>{1}</yellow>"

messages:
  welcome: "<p:components.prefix.standard> <gray>Bienvenue <white><papi:player_name></white> sur HeavenCube.</gray>"
  no-permission: "<sound:block.note_block.bass:0.8:0.8><p:components.prefix.error> <gray>Vous n'avez pas la permission.</gray>"
  reward:
    value: '<sound:entity.player.levelup:0.5:1.2><p:components.prefix.standard> <green>Récompense : {0}</green><actionbar:"<gold>Récompense reçue : {0}</gold>"><title:10:60:10:"<gold>Félicitations !</gold>":"<yellow>{0}</yellow>"><bossbar:"<yellow>{0}</yellow>":100:YELLOW:SOLID:60>'
    type: colored_text

progress:
  experience:
    progress:
      length: 20
      completed: "<green>┃</green>"
      current: "<yellow>┃</yellow>"
      remaining: "<dark_gray>┃</dark_gray>"
      value: "{0}"
      maximum: "{1}"
  summary: "[[hctkey:progress.experience:{0}:{1}]] <gray>{0}/{1}</gray>"

# Facultatif : déclarer ici uniquement de véritables anciennes clés à maintenir.
# Exemple : aliases: {old.close-message: ui.close}
aliases: {}
